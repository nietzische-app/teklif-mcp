<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teklif MCP — Widget Önizleme</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #f4f5f8;
      color: #1a1b1f;
      min-height: 100vh;
    }
    body.dark { background: #070a0e; color: #e8eef7; }
    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.03em; }
    p { color: #667085; margin: 0 0 18px; font-size: 14px; line-height: 1.5; }
    body.dark p { color: #93a0b4; }
    .frame-wrap {
      border: 1px dashed rgba(100,98,243,0.35);
      border-radius: 16px;
      overflow: hidden;
      background: transparent;
      padding: 12px;
    }
    iframe {
      width: 100%;
      height: 420px;
      border: 0;
      display: block;
      background: transparent;
    }
    code { font-size: 12px; background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 6px; }
    body.dark code { background: #141a22; }
    .tog { margin-bottom: 12px; display: flex; gap: 8px; }
    .tog a {
      font-size: 12px; padding: 6px 12px; border-radius: 999px; text-decoration: none;
      border: 1px solid rgba(0,0,0,0.12); color: inherit;
    }
    body.dark .tog a { border-color: rgba(255,255,255,0.14); }
  </style>
</head>
<body>
  <div class="page">
    <h1>Teklif MCP — UI Önizleme</h1>
    <p>
      Website motto (site only): <strong>Tekliflerinizi her yapay zeka sunsun</strong>.
      Widget kaynağı <code>ui://teklif-mcp/offers-v11.html</code> — yalnızca teklif kartları, şeffaf arka plan.
      Veriler <em>örnek / demo</em>dir.
    </p>
    <div class="tog">
      <a href="/preview">açık zemin</a>
      <a href="/preview?bg=dark">koyu zemin</a>
      <a href="/widget" style="color:#6462F3">/widget</a>
    </div>
    <div class="frame-wrap">
      <iframe id="w" title="Teklif widget" src="/widget" allowtransparency="true"></iframe>
    </div>
  </div>
  <script>
    try {
      if (new URLSearchParams(location.search).get("bg") === "dark") document.body.classList.add("dark");
    } catch (_) {}
  </script>
</body>
</html>
