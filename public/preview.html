<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teklif MCP — Widget Önizleme</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #070a0e;
      color: #e8eef7;
      min-height: 100vh;
    }
    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.03em; }
    p { color: #93a0b4; margin: 0 0 18px; font-size: 14px; line-height: 1.5; }
    .frame-wrap {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      overflow: hidden;
      background: #0b0f14;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    iframe {
      width: 100%;
      height: 520px;
      border: 0;
      display: block;
      background: transparent;
    }
    code { font-size: 12px; background: #141a22; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Teklif MCP — UI Önizleme</h1>
    <p>
      Motto: <strong>Tekliflerinizi her yapay zeka sunsun</strong>.
      Aşağıdaki widget MCP Apps (<code>ui://teklif-mcp/offers.html</code>) kaynağının
      tarayıcı önizlemesidir. Veriler <em>örnek / demo</em>dir.
    </p>
    <div class="frame-wrap">
      <iframe id="w" title="Teklif widget" src="./widget-standalone.html"></iframe>
    </div>
  </div>
</body>
</html>
